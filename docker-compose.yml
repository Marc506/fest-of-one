services:
  web:
    build: .
    image: fest-of-one
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/fest.db
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    image: fest-of-one
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/fest.db
    command: ["pnpm", "worker"]
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
